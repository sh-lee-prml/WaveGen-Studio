name: Validate Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface-and-updates:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Frontend regression tests
        run: node tests/run-all.cjs
      - name: Installer and update preservation tests
        shell: pwsh
        run: ./tests/test-update.ps1
      - name: Pinned Hugging Face configuration tests
        shell: pwsh
        run: ./tests/test-model-config.ps1
      - name: Model export orchestration tests
        run: python tests/test-export-tools.py
      - name: Release metadata preservation tests
        run: python tests/test-package-release.py

  native-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned build dependencies
        shell: pwsh
        run: ./scripts/bootstrap-build.ps1
      - name: Build the native application
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Native storage and reference tests
        shell: pwsh
        run: ./scripts/test-native.ps1

# GPU/model acceptance is a separate release check on the documented hardware.
# CI neither downloads model weights nor publishes unreviewed binaries.
